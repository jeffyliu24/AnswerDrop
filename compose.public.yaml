name: answerdrop-public

services:
  app:
    build: .
    environment:
      ANSWERDROP_BASE_URL: https://${ANSWERDROP_DOMAIN:?Set ANSWERDROP_DOMAIN in public.env}
      ANSWERDROP_PUBLISH_TOKEN: ${ANSWERDROP_PUBLISH_TOKEN:?Set ANSWERDROP_PUBLISH_TOKEN in public.env}
    volumes:
      - answerdrop-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ANSWERDROP_DOMAIN: ${ANSWERDROP_DOMAIN:?Set ANSWERDROP_DOMAIN in public.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  answerdrop-data:
  caddy-data:
  caddy-config:
